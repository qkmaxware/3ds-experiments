---
name: Publish Build
on:
  release: 
    types: [ published, edited ]

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Source
        uses: actions/checkout@v6
      - name: Setup Podman
        uses: redhat-actions/podman-install@main
      - name: Start Podman Socket
        run: |
          podman system service --time=0 &
          timeout 30 bash -c 'until podman info > /dev/null 2>&1; do sleep 0.5; done'
      - name: Setup Podman Compose
        uses: webgtx/setup-podman-compose@v1
      - name: Build Compilation Environment
        run: podman compose -f compose.yml build
      - name: Build Projects
        run: podman compose -f compose.yml run --build --rm all
      - name: Upload Binaries to Release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: bin/*.3dsx
          tag: ${{ github.ref }}
          overwrite: true
          file_glob: true